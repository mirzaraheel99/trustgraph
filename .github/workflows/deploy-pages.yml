name: Deploy TrustGraph to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify RLS coverage
        run: pnpm check:rls

      - name: Verify claims boundaries
        run: pnpm check:claims

      - name: Verify pilot acceptance path
        run: pnpm check:pilot-acceptance

      - name: Verify v1 pilot route
        run: pnpm check:v1-pilot-route

      - name: Verify v1 demo flow
        run: pnpm check:v1-demo-flow

      - name: Verify v1 E2E demo loop
        run: pnpm check:v1-e2e-demo

      - name: Verify live database repair path
        run: pnpm check:live-database-repair

      - name: Verify real-data readiness
        run: pnpm check:real-data-readiness

      - name: Verify responsive coverage
        run: pnpm check:responsive

      - name: Verify premium layout shell
        run: pnpm check:premium-layout

      - name: Verify visual design tokens
        run: pnpm check:visual-design-tokens

      - name: Verify Phase C app shell
        run: pnpm check:app-shell-phase-c

      - name: Verify Phase D public shell
        run: pnpm check:public-phase-d

      - name: Verify Phase E auth polish
        run: pnpm check:auth-phase-e

      - name: Verify Phase F corporate workspace
        run: pnpm check:corporate-phase-f

      - name: Verify Phase G Corporate Verify
        run: pnpm check:corporate-verify-phase-g

      - name: Verify Phase H evidence handoff
        run: pnpm check:evidence-phase-h

      - name: Verify Phase I admin export
        run: pnpm check:admin-export-phase-i

      - name: Verify Phase J public signup rescue
        run: pnpm check:public-signup-phase-j

      - name: Verify hosted auth flow
        run: pnpm check:hosted-auth-flow

      - name: Verify hosted console usability
        run: pnpm check:hosted-console-usability

      - name: Verify V1 completion gate
        run: pnpm check:v1-completion-gate

      - name: Verify Supabase migration workflow
        run: pnpm check:migrations-workflow

      - name: Verify server env validator
        run: pnpm check:server-env

      - name: Verify VPS workflow guardrails
        run: pnpm check:vps-workflow

      - name: Build
        run: pnpm build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_TRUSTGRAPH_AUTH_REDIRECT_URL: https://trustgraph.5-75-224-110.sslip.io/

      - name: Stamp release asset
        run: node scripts/stamp-release.mjs out/trustgraph-release.json
        env:
          TRUSTGRAPH_RELEASE_COMMIT: ${{ github.sha }}
          TRUSTGRAPH_RELEASE_UPDATED_AT: ${{ github.event.head_commit.timestamp }}

      - name: Verify release stamp asset
        run: |
          test -s out/trustgraph-release.json
          node -e "const fs = require('fs'); const stamp = JSON.parse(fs.readFileSync('out/trustgraph-release.json', 'utf8')); if (stamp.app !== 'TrustGraph' || stamp.source !== 'https://github.com/mirzaraheel99/trustgraph' || stamp.server_save_contract !== 'trustgraph_release_stamp_static_asset_then_vps_updater_overwrites_with_current_git_commit_and_marker') { throw new Error('TrustGraph release stamp asset is missing the server-save contract'); } if (!stamp.commit || stamp.commit === 'build-time-placeholder' || stamp.commit !== process.env.GITHUB_SHA || stamp.commit_short !== process.env.GITHUB_SHA.slice(0, 7) || stamp.updated_at === 'build-time-placeholder') { throw new Error('TrustGraph release stamp asset was not stamped with the current GitHub commit'); }"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Smoke-check hosted app
        run: node scripts/smoke-live.mjs

  save-vps:
    runs-on: ubuntu-latest
    needs: smoke
    env:
      VPS_HOST: 5.75.224.110
      VPS_USER: ${{ secrets.TRUSTGRAPH_VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.TRUSTGRAPH_VPS_SSH_KEY }}
      PUBLIC_URL: https://trustgraph.5-75-224-110.sslip.io/
      REMOTE_PATH: /opt/trustgraph
    steps:
      - name: Checkout freshness checker
        uses: actions/checkout@v6

      - name: Setup Node for freshness checker
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check VPS deploy secrets
        id: vps-secrets
        run: |
          if [[ -n "$VPS_USER" && -n "$VPS_SSH_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            cat > trustgraph-vps-save-receipt.json <<JSON
          {
            "app": "TrustGraph",
            "status": "ready_for_ssh_save",
            "github_sha": "${GITHUB_SHA}",
            "pages_current": true,
            "vps_saved": false,
            "reason": "deploy_secrets_present",
            "public_url": "$PUBLIC_URL",
            "release_stamp_url": "${PUBLIC_URL%/}/trustgraph-release.json",
            "protected_vfix_host": "https://5-75-224-110.sslip.io",
            "manual_update_command": "cd /opt/trustgraph && git pull --ff-only origin main && bash tools/update-vps-from-github.sh",
            "accepted_when": "vps_release_stamp_json_matches_github_sha_and_bundle_marker_after_manual_or_secret_based_save"
          }
          JSON
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Automatic TrustGraph VPS save skipped because repository secrets TRUSTGRAPH_VPS_USER and TRUSTGRAPH_VPS_SSH_KEY are missing. GitHub Pages is current, but the VPS cannot be proven current until these secrets are added or the manual updater is run."
            cat > trustgraph-vps-save-receipt.json <<JSON
          {
            "app": "TrustGraph",
            "status": "skipped_missing_ssh_secrets",
            "github_sha": "${GITHUB_SHA}",
            "pages_current": true,
            "vps_saved": false,
            "missing_secrets": ["TRUSTGRAPH_VPS_USER", "TRUSTGRAPH_VPS_SSH_KEY"],
            "public_url": "$PUBLIC_URL",
            "release_stamp_url": "${PUBLIC_URL%/}/trustgraph-release.json",
            "protected_vfix_host": "https://5-75-224-110.sslip.io",
            "manual_update_command": "cd /opt/trustgraph && git pull --ff-only origin main && bash tools/update-vps-from-github.sh",
            "accepted_when": "vps_release_stamp_json_matches_github_sha_and_bundle_marker_after_manual_or_secret_based_save"
          }
          JSON
            {
              echo "## TrustGraph VPS save skipped"
              echo ""
              echo "GitHub Pages build, deploy, and smoke completed. The VPS was not updated because the repository is missing TRUSTGRAPH_VPS_USER or TRUSTGRAPH_VPS_SSH_KEY."
              echo ""
              echo "Manual server update remains: cd /opt/trustgraph && git pull --ff-only origin main && bash tools/update-vps-from-github.sh"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload VPS save receipt
        uses: actions/upload-artifact@v4
        with:
          name: trustgraph-vps-save-receipt
          path: trustgraph-vps-save-receipt.json
          if-no-files-found: error

      - name: Require VPS save proof
        if: steps.vps-secrets.outputs.enabled != 'true'
        run: |
          echo "::error::TrustGraph GitHub Pages is current, but the VPS was not saved because TRUSTGRAPH_VPS_USER or TRUSTGRAPH_VPS_SSH_KEY is missing. Run the manual updater on the server or add the deploy secrets before treating https://trustgraph.5-75-224-110.sslip.io/ as current."
          echo "Manual server update: cd /opt/trustgraph && git pull --ff-only origin main && bash tools/update-vps-from-github.sh"
          exit 1

      - name: Configure SSH
        if: steps.vps-secrets.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/trustgraph_vps
          chmod 600 ~/.ssh/trustgraph_vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Save GitHub build to VPS
        if: steps.vps-secrets.outputs.enabled == 'true'
        run: |
          ssh -i ~/.ssh/trustgraph_vps "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/trustgraph
          test "$(pwd)" = "/opt/trustgraph"
          test -f docker-compose.server.yml
          test -f .env.server
          export TRUSTGRAPH_HOST=trustgraph.5-75-224-110.sslip.io
          export PUBLIC_URL=https://trustgraph.5-75-224-110.sslip.io/
          export EXPECTED_BUNDLE_MARKER="premium_workspace_responsive_guard"
          bash tools/update-vps-from-github.sh
          REMOTE

      - name: Verify VPS saved build
        if: steps.vps-secrets.outputs.enabled == 'true'
        env:
          TRUSTGRAPH_VPS_URL: https://trustgraph.5-75-224-110.sslip.io/
        run: node scripts/check-vps-freshness.mjs
