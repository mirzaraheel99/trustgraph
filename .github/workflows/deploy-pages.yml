name: Deploy TrustGraph to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify RLS coverage
        run: pnpm check:rls

      - name: Verify claims boundaries
        run: pnpm check:claims

      - name: Verify pilot acceptance path
        run: pnpm check:pilot-acceptance

      - name: Verify v1 pilot route
        run: pnpm check:v1-pilot-route

      - name: Verify v1 demo flow
        run: pnpm check:v1-demo-flow

      - name: Verify live database repair path
        run: pnpm check:live-database-repair

      - name: Verify real-data readiness
        run: pnpm check:real-data-readiness

      - name: Verify responsive coverage
        run: pnpm check:responsive

      - name: Verify premium layout shell
        run: pnpm check:premium-layout

      - name: Verify Supabase migration workflow
        run: pnpm check:migrations-workflow

      - name: Verify server env validator
        run: pnpm check:server-env

      - name: Verify VPS workflow guardrails
        run: pnpm check:vps-workflow

      - name: Build
        run: pnpm build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Verify release stamp asset
        run: |
          test -s out/trustgraph-release.json
          node -e "const fs = require('fs'); const stamp = JSON.parse(fs.readFileSync('out/trustgraph-release.json', 'utf8')); if (stamp.app !== 'TrustGraph' || stamp.source !== 'https://github.com/mirzaraheel99/trustgraph' || stamp.server_save_contract !== 'trustgraph_release_stamp_static_asset_then_vps_updater_overwrites_with_current_git_commit_and_marker') { throw new Error('TrustGraph release stamp asset is missing the server-save contract'); }"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Smoke-check hosted app
        run: node scripts/smoke-live.mjs

  save-vps:
    runs-on: ubuntu-latest
    needs: smoke
    env:
      VPS_HOST: 5.75.224.110
      VPS_USER: ${{ secrets.TRUSTGRAPH_VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.TRUSTGRAPH_VPS_SSH_KEY }}
      PUBLIC_URL: https://trustgraph.5-75-224-110.sslip.io/
      REMOTE_PATH: /opt/trustgraph
    steps:
      - name: Checkout freshness checker
        uses: actions/checkout@v6

      - name: Setup Node for freshness checker
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check VPS deploy secrets
        id: vps-secrets
        run: |
          if [[ -n "$VPS_USER" && -n "$VPS_SSH_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Automatic TrustGraph VPS save requires repository secrets TRUSTGRAPH_VPS_USER and TRUSTGRAPH_VPS_SSH_KEY. GitHub is the source of truth, but the VPS cannot be proven current without these secrets."
            exit 1
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/trustgraph_vps
          chmod 600 ~/.ssh/trustgraph_vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Save GitHub build to VPS
        run: |
          ssh -i ~/.ssh/trustgraph_vps "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/trustgraph
          test "$(pwd)" = "/opt/trustgraph"
          test -f docker-compose.server.yml
          test -f .env.server
          export TRUSTGRAPH_HOST=trustgraph.5-75-224-110.sslip.io
          export PUBLIC_URL=https://trustgraph.5-75-224-110.sslip.io/
          export EXPECTED_BUNDLE_MARKER="live_data_loading_command"
          bash tools/update-vps-from-github.sh
          REMOTE

      - name: Verify VPS saved build
        env:
          TRUSTGRAPH_VPS_URL: https://trustgraph.5-75-224-110.sslip.io/
        run: node scripts/check-vps-freshness.mjs
