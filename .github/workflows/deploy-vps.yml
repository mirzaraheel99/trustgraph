name: Deploy TrustGraph to VPS

on:
  workflow_dispatch:
    inputs:
      target_host:
        description: VPS host or IP for TrustGraph
        required: true
        default: 5.75.224.11
      remote_path:
        description: Existing TrustGraph checkout path on the VPS
        required: true
        default: /opt/trustgraph

permissions:
  contents: read

concurrency:
  group: trustgraph-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ inputs.target_host }}
      VPS_USER: ${{ secrets.TRUSTGRAPH_VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.TRUSTGRAPH_VPS_SSH_KEY }}
      REMOTE_PATH: ${{ inputs.remote_path }}
    steps:
      - name: Validate target
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test "$REMOTE_PATH" = "/opt/trustgraph"
          case "$VPS_HOST" in
            5.75.224.110|5-75-224-110.sslip.io)
              echo "Refusing to deploy TrustGraph to the VFIX host." >&2
              exit 1
              ;;
          esac

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/trustgraph_vps
          chmod 600 ~/.ssh/trustgraph_vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy from GitHub checkout on VPS
        run: |
          ssh -i ~/.ssh/trustgraph_vps "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/trustgraph
          test "$(pwd)" = "/opt/trustgraph"
          test -f docker-compose.server.yml
          test -f .env.server
          git fetch origin main
          git pull --ff-only origin main
          docker compose --env-file .env.server -f docker-compose.server.yml up -d --build
          docker compose --env-file .env.server -f docker-compose.server.yml ps
          REMOTE

      - name: Smoke-check VPS
        run: |
          curl --fail --location --silent --show-error "https://$VPS_HOST" >/tmp/trustgraph-vps.html
          grep -q "TrustGraph" /tmp/trustgraph-vps.html
