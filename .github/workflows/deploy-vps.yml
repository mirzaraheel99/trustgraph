name: Deploy TrustGraph to VPS

on:
  workflow_dispatch:
    inputs:
      target_host:
        description: VPS host or IP for TrustGraph
        required: true
        default: 5.75.224.110
      public_url:
        description: Public HTTPS URL to smoke-check after deploy
        required: true
        default: https://trustgraph.5-75-224-110.sslip.io
      remote_path:
        description: Existing TrustGraph checkout path on the VPS
        required: true
        default: /opt/trustgraph

permissions:
  contents: read

concurrency:
  group: trustgraph-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ inputs.target_host }}
      VPS_USER: ${{ secrets.TRUSTGRAPH_VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.TRUSTGRAPH_VPS_SSH_KEY }}
      PUBLIC_URL: ${{ inputs.public_url }}
      REMOTE_PATH: ${{ inputs.remote_path }}
    steps:
      - name: Validate target
        run: |
          fail() {
            echo "TrustGraph VPS deploy validation failed: $*" >&2
            exit 1
          }

          test -n "$VPS_HOST" || fail "target_host input is required."
          test -n "$VPS_USER" || fail "repository secret TRUSTGRAPH_VPS_USER is required."
          test -n "$VPS_SSH_KEY" || fail "repository secret TRUSTGRAPH_VPS_SSH_KEY is required."
          test -n "$PUBLIC_URL" || fail "public_url input is required."
          test "$REMOTE_PATH" = "/opt/trustgraph"
          case "$VPS_HOST" in
            5-75-224-110.sslip.io)
              echo "Use the VPS IP for SSH, not the protected VFIX public hostname." >&2
              exit 1
              ;;
          esac
          case "$PUBLIC_URL" in
            https://5-75-224-110.sslip.io*|*CRM-client-demo*)
              echo "Refusing to smoke-check the VFIX host or CRM-client-demo route." >&2
              exit 1
              ;;
            https://trustgraph.5-75-224-110.sslip.io|https://trustgraph.5-75-224-110.sslip.io/)
              ;;
            *)
              echo "Public URL must be the approved TrustGraph sslip.io host." >&2
              exit 1
              ;;
          esac

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/trustgraph_vps
          chmod 600 ~/.ssh/trustgraph_vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy from GitHub checkout on VPS
        run: |
          ssh -i ~/.ssh/trustgraph_vps "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/trustgraph
          test "$(pwd)" = "/opt/trustgraph"
          test -f docker-compose.server.yml
          test -f .env.server
          export TRUSTGRAPH_HOST=trustgraph.5-75-224-110.sslip.io
          export PUBLIC_URL=https://trustgraph.5-75-224-110.sslip.io/
          export EXPECTED_BUNDLE_MARKER="live_data_loading_command"
          bash tools/update-vps-from-github.sh
          REMOTE

      - name: Checkout freshness checker
        uses: actions/checkout@v6

      - name: Setup Node for freshness checker
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Smoke-check VPS
        env:
          TRUSTGRAPH_VPS_URL: ${{ inputs.public_url }}
        run: |
          node scripts/check-vps-freshness.mjs
