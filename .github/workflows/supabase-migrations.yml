name: Apply Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/*.sql"
  workflow_dispatch:
    inputs:
      migration_path:
        description: SQL file glob to apply
        required: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      MIGRATION_PATH: ${{ inputs.migration_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verify database URL
        run: |
          test -n "$DIRECT_URL"

      - name: Collect migration files
        run: |
          rm -f /tmp/trustgraph-migrations.txt
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test -n "$MIGRATION_PATH"
            for file in $MIGRATION_PATH; do
              case "$file" in
                supabase/migrations/*.sql) ;;
                *) echo "Migration path must stay under supabase/migrations/*.sql: $file" >&2; exit 1 ;;
              esac
              test -f "$file"
              printf '%s\n' "$file" >> /tmp/trustgraph-migrations.txt
            done
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- "supabase/migrations/*.sql" > /tmp/trustgraph-migrations.txt
          fi
          test -s /tmp/trustgraph-migrations.txt
          while IFS= read -r file; do
            case "$file" in
              supabase/migrations/*.sql) ;;
              *) echo "Migration path must stay under supabase/migrations/*.sql: $file" >&2; exit 1 ;;
            esac
            test -f "$file"
          done
          sort -u /tmp/trustgraph-migrations.txt -o /tmp/trustgraph-migrations.txt
          cat /tmp/trustgraph-migrations.txt

      - name: Apply SQL migrations
        run: |
          while IFS= read -r file; do
            echo "Applying $file"
            PGOPTIONS="-c statement_timeout=30000" psql "$DIRECT_URL" --set ON_ERROR_STOP=1 --echo-errors --file "$file"
          done < /tmp/trustgraph-migrations.txt

      - name: Record migration ledger
        run: |
          while IFS= read -r file; do
            echo "Recording $file"
            PGOPTIONS="-c statement_timeout=30000" psql "$DIRECT_URL" --set ON_ERROR_STOP=1 --echo-errors \
              --command "select public.record_schema_migration_run('$file', '${{ github.sha }}', '${{ github.run_id }}', '${{ github.actor }}', 'applied', 'Applied through GitHub Actions');"
          done < /tmp/trustgraph-migrations.txt
