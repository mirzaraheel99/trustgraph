services:
  trustgraph-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AUTH_PROVIDER: ${NEXT_PUBLIC_AUTH_PROVIDER:-postgres}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    environment:
      TRUSTGRAPH_HOST: ${TRUSTGRAPH_HOST:-trustgraph.5-75-224-110.sslip.io}
    ports:
      - "${TRUSTGRAPH_HTTP_BIND:-0.0.0.0}:${TRUSTGRAPH_HTTP_PORT:-80}:80"
      - "${TRUSTGRAPH_HTTPS_BIND:-0.0.0.0}:${TRUSTGRAPH_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - trustgraph-postgres
      - trustgraph-auth-api

  trustgraph-auth-api:
    build:
      context: .
      dockerfile: Dockerfile.auth
    restart: unless-stopped
    environment:
      TRUSTGRAPH_AUTH_API_PORT: 4181
      POSTGRES_HOST: trustgraph-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-trustgraph}
      POSTGRES_USER: ${POSTGRES_USER:-trustgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.server}
      TRUSTGRAPH_SESSION_TTL_SECONDS: ${TRUSTGRAPH_SESSION_TTL_SECONDS:-1209600}
    depends_on:
      trustgraph-postgres:
        condition: service_healthy

  trustgraph-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trustgraph}
      POSTGRES_USER: ${POSTGRES_USER:-trustgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.server}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - trustgraph_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trustgraph} -d ${POSTGRES_DB:-trustgraph}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  trustgraph_postgres_data:
